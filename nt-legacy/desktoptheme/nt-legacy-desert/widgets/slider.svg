      <rect x="12" y="12" width="6" height="1" fill="#202628"/>
      <rect x="13" y="13" width="5" height="1" fill="#f4f0e6"/>
      <rect x="12" y="12" width="1" height="6" fill="#202628"/>
      <rect x="13" y="13" width="1" height="5" fill="#f4f0e6"/>
    </g>
    <g id="groove-top">
