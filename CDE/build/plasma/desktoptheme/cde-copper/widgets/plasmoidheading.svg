    <rect id="footer-hint-left-margin" x="56" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
    <rect id="footer-hint-right-margin" x="84" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
</svg>
