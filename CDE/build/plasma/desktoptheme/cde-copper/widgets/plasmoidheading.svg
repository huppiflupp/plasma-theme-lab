      <rect x="38" y="43" width="6" height="1" fill="#10262b"/>
      <rect x="38" y="42" width="5" height="1" fill="#764528"/>
      <rect x="43" y="38" width="1" height="6" fill="#10262b"/>
      <rect x="42" y="38" width="1" height="5" fill="#764528"/>
    </g>
    <rect id="header-hint-top-margin" x="28" y="12" width="2" height="4" fill="#ff00ff" opacity="0"/>
