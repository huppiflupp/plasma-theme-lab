      <rect x="56" y="12" width="6" height="1" fill="#10262b"/>
      <rect x="57" y="13" width="5" height="1" fill="#c9dedb"/>
      <rect x="56" y="12" width="1" height="6" fill="#10262b"/>
      <rect x="57" y="13" width="1" height="5" fill="#c9dedb"/>
    </g>
    <g id="footer-top">
