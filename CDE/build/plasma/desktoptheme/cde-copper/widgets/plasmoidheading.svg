      <rect x="56" y="18" width="6" height="20" fill="#86a4aa"/>
      <rect x="56" y="18" width="1" height="20" fill="#10262b"/>
      <rect x="57" y="18" width="1" height="20" fill="#c9dedb"/>
    </g>
    <g id="footer-center">
      <rect x="62" y="18" width="20" height="20" fill="#86a4aa"/>
    </g>
    <g id="footer-right">
      <rect x="82" y="18" width="6" height="20" fill="#86a4aa"/>
      <rect x="87" y="18" width="1" height="20" fill="#10262b"/>
      <rect x="86" y="18" width="1" height="20" fill="#41646a"/>
    </g>
    <g id="footer-bottomleft">
