<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <!-- translucentbackground.svg — Miniprogramm im Bearbeitungsmodus -->
  <!-- Erzeugt von tools/gen-plasma-svg.py. Die Element-IDs sind
       die Schnittstelle zu Plasma: bitte nicht umbenennen. -->
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color:#10262b; stop-color:#10262b; }
      .ColorScheme-Background { color:#86a4aa; stop-color:#86a4aa; }
      .ColorScheme-Highlight { color:#e8874f; stop-color:#e8874f; }
      .ColorScheme-ViewText { color:#10262b; stop-color:#10262b; }
      .ColorScheme-ViewBackground { color:#c4d2d0; stop-color:#c4d2d0; }
      .ColorScheme-ViewHover { color:#f0b184; stop-color:#f0b184; }
      .ColorScheme-ViewFocus { color:#e8874f; stop-color:#e8874f; }
      .ColorScheme-ButtonText { color:#10262b; stop-color:#10262b; }
      .ColorScheme-ButtonBackground { color:#86a4aa; stop-color:#86a4aa; }
      .ColorScheme-ButtonHover { color:#f0b184; stop-color:#f0b184; }
      .ColorScheme-ButtonFocus { color:#e8874f; stop-color:#e8874f; }
      .ColorScheme-HighlightedText { color:#10262b; stop-color:#10262b; }
      .ColorScheme-ComplementaryBackground { color:#2e7180; stop-color:#2e7180; }
      .ColorScheme-NegativeText { color:#a32626; stop-color:#a32626; }
      .ColorScheme-NeutralText { color:#aa571b; stop-color:#aa571b; }
      .ColorScheme-PositiveText { color:#24643d; stop-color:#24643d; }
    </style>
  </defs>
  <!-- (Standardzustand) -->
    <g id="topleft">
      <rect x="12" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="12" width="6" height="1" fill="#10262b"/>
      <rect x="13" y="13" width="5" height="1" fill="#c9dedb"/>
      <rect x="12" y="12" width="1" height="6" fill="#10262b"/>
      <rect x="13" y="13" width="1" height="5" fill="#c9dedb"/>
    </g>
    <g id="top">
      <rect x="18" y="12" width="20" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="18" y="12" width="20" height="1" fill="#10262b"/>
      <rect x="18" y="13" width="20" height="1" fill="#c9dedb"/>
    </g>
    <g id="topright">
      <rect x="38" y="12" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="38" y="12" width="6" height="1" fill="#10262b"/>
      <rect x="38" y="13" width="5" height="1" fill="#c9dedb"/>
      <rect x="43" y="12" width="1" height="6" fill="#10262b"/>
      <rect x="42" y="13" width="1" height="5" fill="#41646a"/>
    </g>
    <g id="left">
      <rect x="12" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="18" width="1" height="20" fill="#10262b"/>
      <rect x="13" y="18" width="1" height="20" fill="#c9dedb"/>
    </g>
    <g id="center">
      <rect x="18" y="18" width="20" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
    </g>
    <g id="right">
      <rect x="38" y="18" width="6" height="20" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="43" y="18" width="1" height="20" fill="#10262b"/>
      <rect x="42" y="18" width="1" height="20" fill="#41646a"/>
    </g>
    <g id="bottomleft">
      <rect x="12" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="12" y="43" width="6" height="1" fill="#10262b"/>
      <rect x="13" y="42" width="5" height="1" fill="#41646a"/>
      <rect x="12" y="38" width="1" height="6" fill="#10262b"/>
      <rect x="13" y="38" width="1" height="5" fill="#c9dedb"/>
    </g>
    <g id="bottom">
      <rect x="18" y="38" width="20" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="18" y="43" width="20" height="1" fill="#10262b"/>
      <rect x="18" y="42" width="20" height="1" fill="#41646a"/>
    </g>
    <g id="bottomright">
      <rect x="38" y="38" width="6" height="6" class="ColorScheme-Background" style="fill:currentColor;fill-opacity:1;stroke:none"/>
      <rect x="38" y="43" width="6" height="1" fill="#10262b"/>
      <rect x="38" y="42" width="5" height="1" fill="#41646a"/>
      <rect x="43" y="38" width="1" height="6" fill="#10262b"/>
      <rect x="42" y="38" width="1" height="5" fill="#41646a"/>
    </g>
    <rect id="hint-top-margin" x="28" y="12" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="hint-bottom-margin" x="28" y="40" width="2" height="4" fill="#ff00ff" opacity="0"/>
    <rect id="hint-left-margin" x="12" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
    <rect id="hint-right-margin" x="40" y="28" width="4" height="2" fill="#ff00ff" opacity="0"/>
</svg>
